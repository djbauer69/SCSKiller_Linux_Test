name: KDE UI

on:
  push:
    branches: [ linux-vulkan-proton ]
    paths:
      - "gui/kde/**"
      - "native/vulkan-layer/**"
      - "native/vulkan-warmer/**"
      - "src/SCSKiller.Graphics/**"
      - "src/SCSKiller.Linux.Cli/**"
      - "scripts/package-linux.sh"
      - "scripts/install-user-package.sh"
      - "packaging/arch/**"
      - "README.md"
      - "LINUX.md"
      - "LICENSE"
      - "LICENSE-EXCEPTION.txt"
      - "THIRD-PARTY-NOTICES.md"
      - ".github/workflows/kde-ui.yml"
  pull_request:
    paths:
      - "gui/kde/**"
      - "native/vulkan-layer/**"
      - "native/vulkan-warmer/**"
      - "src/SCSKiller.Graphics/**"
      - "src/SCSKiller.Linux.Cli/**"
      - "scripts/package-linux.sh"
      - "scripts/install-user-package.sh"
      - "packaging/arch/**"
      - "README.md"
      - "LINUX.md"
      - "LICENSE"
      - "LICENSE-EXCEPTION.txt"
      - "THIRD-PARTY-NOTICES.md"
      - ".github/workflows/kde-ui.yml"

jobs:
  build-kirigami:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6 and KDE dependencies
        run: |
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm --needed \
            base-devel cmake ninja dotnet-sdk-10.0 vulkan-headers vulkan-icd-loader \
            qt6-base qt6-declarative qt6-shadertools kirigami \
            icu openssl krb5 zlib libunwind git
      - name: Validate packaging shell syntax
        run: |
          bash -n scripts/package-linux.sh
          bash -n scripts/install-user-package.sh
          bash -n packaging/arch/PKGBUILD
      - name: Validate Arch PKGBUILD metadata
        run: |
          useradd --create-home --user-group pkgcheck
          mkdir -p build/pkgbuild-check
          cp packaging/arch/PKGBUILD build/pkgbuild-check/PKGBUILD
          chown -R pkgcheck:pkgcheck build/pkgbuild-check
          runuser -u pkgcheck -- bash -c 'cd "$1" && makepkg --printsrcinfo > .SRCINFO' _ \
            "$GITHUB_WORKSPACE/build/pkgbuild-check"
          grep -q 'pkgname = scskiller-linux-git' build/pkgbuild-check/.SRCINFO
          grep -q 'depends = vulkan-icd-loader' build/pkgbuild-check/.SRCINFO
          grep -q 'makedepends = dotnet-sdk-10.0' build/pkgbuild-check/.SRCINFO
      - name: Build and install the Arch package with makepkg
        run: |
          mkdir -p build/pkgbuild-build
          cp packaging/arch/PKGBUILD build/pkgbuild-build/PKGBUILD
          chown -R pkgcheck:pkgcheck build/pkgbuild-build
          runuser -u pkgcheck -- bash -c 'cd "$1" && makepkg --cleanbuild --noconfirm' _ \
            "$GITHUB_WORKSPACE/build/pkgbuild-build"
          package_file="$(find build/pkgbuild-build -maxdepth 1 -type f -name '*.pkg.tar.zst' -print -quit)"
          test -n "$package_file"
          pacman -U --noconfirm "$package_file"
          test -x /opt/scskiller-linux/bin/scskiller-kde
          test -x /opt/scskiller-linux/bin/scskiller-linux
          test -x /opt/scskiller-linux/bin/scskiller-vulkan-warmer
          test -L /usr/bin/scskiller-linux
          test -L /usr/bin/scskiller-kde
          test -s /usr/share/applications/scskiller-kde.desktop
          grep -q '^Exec=/opt/scskiller-linux/bin/scskiller-kde$' /usr/share/applications/scskiller-kde.desktop
          scskiller-linux help
      - name: Configure Kirigami app
        run: cmake -S gui/kde -B build/kde-ui -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build Kirigami app
        run: cmake --build build/kde-ui --parallel
      - name: Stage full Linux package with KDE UI
        env:
          STAGE: ${{ github.workspace }}/build/package-kde
          BUILD_ROOT: ${{ github.workspace }}/build/package-kde-native
          BUILD_KDE_UI: "1"
        run: |
          bash scripts/package-linux.sh
          test -x build/package-kde/bin/scskiller-linux
          test -x build/package-kde/bin/scskiller-vulkan-warmer
          test -x build/package-kde/bin/scskiller-kde
          test -s build/package-kde/share/applications/scskiller-kde.desktop
          test -s build/package-kde/share/doc/scskiller-linux/LICENSE
          test -x build/package-kde/install-user-package.sh
      - name: Install staged KDE package into a clean user home
        env:
          QT_QPA_PLATFORM: offscreen
          QT_DEBUG_PLUGINS: "1"
          QML_IMPORT_TRACE: "1"
          SCSKILLER_KDE_DEBUG: "1"
        run: |
          install_home="$GITHUB_WORKSPACE/build/package-install-home"
          HOME="$install_home" DEST="$install_home/.local/opt/scskiller-linux" BIN_DIR="$install_home/.local/bin" APPLICATIONS_DIR="$install_home/.local/share/applications" bash build/package-kde/install-user-package.sh "$GITHUB_WORKSPACE/build/package-kde"
          install_root="$install_home/.local/opt/scskiller-linux"
          test -x "$install_root/bin/scskiller-linux"
          test -x "$install_root/bin/scskiller-kde"
          test -L "$install_home/.local/bin/scskiller-linux"
          grep -F "Exec=\"$install_root/bin/scskiller-kde\"" "$install_home/.local/share/applications/scskiller-kde.desktop"
          "$install_home/.local/bin/scskiller-linux" help
          set +e
          PATH="$install_home/.local/bin:$PATH" env -u SCSKILLER_HOME -u SCSKILLER_CLI timeout 8s "$install_root/bin/scskiller-kde" > build/kde-installed-smoke.log 2>&1
          status=$?
          set -e
          cat build/kde-installed-smoke.log
          grep -F "SCSKiller CLI launcher: $install_root/bin/scskiller-linux" build/kde-installed-smoke.log
          grep -F "Default Vulkan layer directory: $install_root/share/vulkan/explicit_layer.d" build/kde-installed-smoke.log
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            echo "Installed KDE UI exited unexpectedly with status $status" >&2
            exit 1
          fi
          if grep -Eiq 'module .* is not installed|type .* unavailable|referenceerror|failed to load .*qml|cannot assign to non-existent property' build/kde-installed-smoke.log; then
            echo "Installed QML runtime loading reported an error" >&2
            exit 1
          fi
          # Reinstalling over our recognized installation should be safe and idempotent.
          HOME="$install_home" DEST="$install_root" BIN_DIR="$install_home/.local/bin" APPLICATIONS_DIR="$install_home/.local/share/applications" bash build/package-kde/install-user-package.sh "$GITHUB_WORKSPACE/build/package-kde"
          test -x "$install_root/bin/scskiller-kde"
          grep -F "Exec=\"$install_root/bin/scskiller-kde\"" "$install_home/.local/share/applications/scskiller-kde.desktop"
      - name: Ensure user installer preserves unrelated files and symlinks
        run: |
          source_package="$GITHUB_WORKSPACE/build/package-kde"
          test_root="$GITHUB_WORKSPACE/build/installer-safety"
          mkdir -p "$test_root/unsafe-home/.local/opt/scskiller-linux"
          printf '%s\n' 'keep me' > "$test_root/unsafe-home/.local/opt/scskiller-linux/user-data.txt"
          if HOME="$test_root/unsafe-home" DEST="$test_root/unsafe-home/.local/opt/scskiller-linux" BIN_DIR="$test_root/unsafe-home/.local/bin" APPLICATIONS_DIR="$test_root/unsafe-home/.local/share/applications" bash "$source_package/install-user-package.sh" "$source_package" > "$test_root/unsafe-dest.log" 2>&1; then
            echo "Installer unexpectedly accepted an unrelated non-empty directory" >&2
            exit 1
          fi
          grep -q 'Refusing to copy over an unrelated non-empty directory' "$test_root/unsafe-dest.log"
          grep -Fxq 'keep me' "$test_root/unsafe-home/.local/opt/scskiller-linux/user-data.txt"
          test ! -e "$test_root/unsafe-home/.local/bin/scskiller-linux"

          mkdir -p "$test_root/symlink-home/.local/opt" "$test_root/symlink-home/.local/bin"
          ln -s /usr/bin/false "$test_root/symlink-home/.local/bin/scskiller-linux"
          if HOME="$test_root/symlink-home" DEST="$test_root/symlink-home/.local/opt/scskiller-linux" BIN_DIR="$test_root/symlink-home/.local/bin" APPLICATIONS_DIR="$test_root/symlink-home/.local/share/applications" bash "$source_package/install-user-package.sh" "$source_package" > "$test_root/unsafe-link.log" 2>&1; then
            echo "Installer unexpectedly replaced an unrelated CLI symlink" >&2
            exit 1
          fi
          grep -q 'Refusing to replace a symlink owned by another application' "$test_root/unsafe-link.log"
          test "$(readlink "$test_root/symlink-home/.local/bin/scskiller-linux")" = "/usr/bin/false"
          test ! -e "$test_root/symlink-home/.local/opt/scskiller-linux"

          mkdir -p "$test_root/desktop-home/.local/share/applications"
          cat > "$test_root/desktop-home/.local/share/applications/scskiller-kde.desktop" <<'EOF'
          [Desktop Entry]
          Name=Unrelated application
          Exec=/usr/bin/true
          EOF
          if HOME="$test_root/desktop-home" DEST="$test_root/desktop-home/.local/opt/scskiller-linux" BIN_DIR="$test_root/desktop-home/.local/bin" APPLICATIONS_DIR="$test_root/desktop-home/.local/share/applications" bash "$source_package/install-user-package.sh" "$source_package" > "$test_root/unsafe-desktop.log" 2>&1; then
            echo "Installer unexpectedly replaced an unrelated desktop entry" >&2
            exit 1
          fi
          grep -q 'Refusing to replace an unrelated desktop entry' "$test_root/unsafe-desktop.log"
          grep -Fxq 'Name=Unrelated application' "$test_root/desktop-home/.local/share/applications/scskiller-kde.desktop"
          test ! -e "$test_root/desktop-home/.local/opt/scskiller-linux"

          mkdir -p "$test_root/broken-desktop-home/.local/share/applications"
          ln -s "$test_root/no-such-desktop-target" "$test_root/broken-desktop-home/.local/share/applications/scskiller-kde.desktop"
          if HOME="$test_root/broken-desktop-home" DEST="$test_root/broken-desktop-home/.local/opt/scskiller-linux" BIN_DIR="$test_root/broken-desktop-home/.local/bin" APPLICATIONS_DIR="$test_root/broken-desktop-home/.local/share/applications" bash "$source_package/install-user-package.sh" "$source_package" > "$test_root/broken-desktop.log" 2>&1; then
            echo "Installer unexpectedly followed a broken desktop-entry symlink" >&2
            exit 1
          fi
          grep -q 'Refusing to write through a symlinked desktop entry' "$test_root/broken-desktop.log"
          test "$(readlink "$test_root/broken-desktop-home/.local/share/applications/scskiller-kde.desktop")" = "$test_root/no-such-desktop-target"
          test ! -e "$test_root/broken-desktop-home/.local/opt/scskiller-linux"
      - name: Upload KDE-enabled Linux package
        uses: actions/upload-artifact@v4
        with:
          name: scskiller-linux-kde-${{ github.sha }}
          path: build/package-kde/
          if-no-files-found: error
          retention-days: 14
      - name: Smoke-load the QML application
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set +e
          timeout 8s build/kde-ui/scskiller-kde > build/kde-ui-smoke.log 2>&1
          status=$?
          set -e
          cat build/kde-ui-smoke.log
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            echo "KDE UI exited unexpectedly with status $status" >&2
            exit 1
          fi
          if grep -Eiq 'module .* is not installed|type .* unavailable|referenceerror|failed to load .*qml|cannot assign to non-existent property' build/kde-ui-smoke.log; then
            echo "QML runtime loading reported an error" >&2
            exit 1
          fi
