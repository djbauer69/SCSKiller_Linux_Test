name: Linux

on:
  push:
    branches: [ linux-vulkan-proton ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Vulkan development files
        run: sudo apt-get update && sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers glslc cmake ninja-build
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x
      - name: Build managed Linux projects
        run: dotnet build src/SCSKiller.Graphics/SCSKiller.Graphics.csproj -c Release
      - name: Build Linux CLI
        run: dotnet build src/SCSKiller.Linux.Cli/SCSKiller.Linux.Cli.csproj -c Release
      - name: Configure native Vulkan layer
        run: cmake -S native/vulkan-layer -B build/vulkan-layer -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build native Vulkan layer
        run: cmake --build build/vulkan-layer
      - name: Inspect Vulkan layer ABI exports
        run: |
          nm -D --defined-only build/vulkan-layer/VK_LAYER_SCSKILLER.so | grep -E 'vk(CreateInstance|GetInstanceProcAddr|NegotiateLoaderLayerInterfaceVersion|layerGetPhysicalDeviceProcAddr)'
          python3 - <<'PY'
          import ctypes
          lib = ctypes.CDLL("build/vulkan-layer/VK_LAYER_SCSKILLER.so")
          gipa = lib.vkGetInstanceProcAddr
          gipa.argtypes = [ctypes.c_void_p, ctypes.c_char_p]
          gipa.restype = ctypes.c_void_p
          assert gipa(None, b"vkCreateInstance"), "layer GIPA did not return vkCreateInstance"
          print("Layer ABI GIPA returned vkCreateInstance")
          PY
      - name: Configure Vulkan probe
        run: cmake -S native/vulkan-probe -B build/vulkan-probe -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build Vulkan probe
        run: cmake --build build/vulkan-probe
      - name: Configure Vulkan warmer
        run: cmake -S native/vulkan-warmer -B build/vulkan-warmer -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build Vulkan warmer
        run: cmake --build build/vulkan-warmer
      - name: Install Vulkan layer for loader smoke test
        run: cmake --install build/vulkan-layer --prefix build/vulkan-install
      - name: Compile Vulkan smoke shader
        run: |
          mkdir -p build/vulkan-smoke
          cat > build/vulkan-smoke/compute.comp <<'EOF'
          #version 450
          layout(local_size_x = 1, local_size_y = 1, local_size_z = 1) in;
          void main() {}
          EOF
          glslc -fshader-stage=compute build/vulkan-smoke/compute.comp -o build/vulkan-smoke/compute.spv
          cat > build/vulkan-smoke/specialization.comp <<'EOF'
          #version 450
          layout(local_size_x = 1, local_size_y = 1, local_size_z = 1) in;
          layout(constant_id = 0) const uint gate = 1u;
          void main() {
              if (gate == 7u) {
                  barrier();
              }
          }
          EOF
          glslc -fshader-stage=compute build/vulkan-smoke/specialization.comp -o build/vulkan-smoke/specialization.spv
      - name: Run Vulkan loader smoke test with SCSKiller layer
        env:
          VK_LAYER_PATH: ${{ github.workspace }}/build/vulkan-install/share/vulkan/explicit_layer.d
          LD_LIBRARY_PATH: ${{ github.workspace }}/build/vulkan-install/lib
          VK_INSTANCE_LAYERS: VK_LAYER_SCSKILLER
          NODEVICE_SELECT: "1"
          SCSKILLER_VK_RECORD: "1"
          SCSKILLER_VK_RECORD_FILE: ${{ github.workspace }}/build/vulkan-smoke/capture.jsonl
          SCSKILLER_VK_DEBUG: "1"
          VK_LOADER_DEBUG: "all"
        run: |
          timeout 60s build/vulkan-probe/scskiller-vulkan-probe build/vulkan-smoke/compute.spv
          test -s build/vulkan-smoke/capture.jsonl
          grep -q '"event":"shader_module_create"' build/vulkan-smoke/capture.jsonl
          grep -q '"event":"shader_module_code"' build/vulkan-smoke/capture.jsonl
          grep -q '"event":"descriptor_set_layout_create"' build/vulkan-smoke/capture.jsonl
          grep -q '"event":"pipeline_layout_create"' build/vulkan-smoke/capture.jsonl
          grep -q '"event":"compute_pipeline_state"' build/vulkan-smoke/capture.jsonl
          grep -q '"event":"pipeline_cache_snapshot"' build/vulkan-smoke/capture.jsonl
      - name: Capture and replay a compute pipeline with specialization constants
        env:
          VK_LAYER_PATH: ${{ github.workspace }}/build/vulkan-install/share/vulkan/explicit_layer.d
          LD_LIBRARY_PATH: ${{ github.workspace }}/build/vulkan-install/lib
          VK_INSTANCE_LAYERS: VK_LAYER_SCSKILLER
          NODEVICE_SELECT: "1"
          SCSKILLER_VK_RECORD: "1"
          SCSKILLER_VK_RECORD_FILE: ${{ github.workspace }}/build/vulkan-smoke/specialization-capture.jsonl
        run: |
          timeout 60s build/vulkan-probe/scskiller-vulkan-probe --specialization build/vulkan-smoke/specialization.spv
          test -s build/vulkan-smoke/specialization-capture.jsonl
          grep -q '"data_size":4' build/vulkan-smoke/specialization-capture.jsonl
          grep -q '"constant_id":0,"offset":0,"size":4' build/vulkan-smoke/specialization-capture.jsonl
          grep -q '"data_base64":"BwAAAA=="' build/vulkan-smoke/specialization-capture.jsonl
          dotnet run --project src/SCSKiller.Linux.Cli/SCSKiller.Linux.Cli.csproj -c Release -- \
            plan-vulkan build/vulkan-smoke/specialization-capture.jsonl > build/vulkan-smoke/specialization-plan.log
          grep -q 'Pipeline plan: 1 total; 1 replayable; 0 unsupported' build/vulkan-smoke/specialization-plan.log
          timeout 60s build/vulkan-warmer/scskiller-vulkan-warmer \
            build/vulkan-smoke/specialization-capture.jsonl - \
            build/vulkan-smoke/specialization-warmed.cache.bin \
            > build/vulkan-smoke/specialization-replay.log 2>&1
          cat build/vulkan-smoke/specialization-replay.log
          test -s build/vulkan-smoke/specialization-warmed.cache.bin
          grep -q 'Compute replay: requested 1, compiled 1, skipped 0, failed 0' build/vulkan-smoke/specialization-replay.log

      - name: Exercise physical-device group enumeration through the Vulkan layer
        env:
          VK_LAYER_PATH: ${{ github.workspace }}/build/vulkan-install/share/vulkan/explicit_layer.d
          LD_LIBRARY_PATH: ${{ github.workspace }}/build/vulkan-install/lib
          VK_INSTANCE_LAYERS: VK_LAYER_SCSKILLER
          NODEVICE_SELECT: "1"
          SCSKILLER_VK_RECORD: "1"
          SCSKILLER_VK_RECORD_FILE: ${{ github.workspace }}/build/vulkan-smoke/device-groups-capture.jsonl
        run: |
          timeout 60s build/vulkan-probe/scskiller-vulkan-probe --device-groups
          test -s build/vulkan-smoke/device-groups-capture.jsonl
          grep -q '"event":"physical_device_identity"' build/vulkan-smoke/device-groups-capture.jsonl

      - name: Compile Vulkan graphics smoke shaders
        run: |
          cat > build/vulkan-smoke/vertex.vert <<'EOF'
          #version 450
          void main() {
              gl_Position = vec4(0.0, 0.0, 0.0, 1.0);
          }
          EOF
          cat > build/vulkan-smoke/fragment.frag <<'EOF'
          #version 450
          layout(location = 0) out vec4 outColor;
          void main() {
              outColor = vec4(1.0, 0.0, 1.0, 1.0);
          }
          EOF
          glslc -fshader-stage=vertex build/vulkan-smoke/vertex.vert -o build/vulkan-smoke/vertex.spv
          glslc -fshader-stage=fragment build/vulkan-smoke/fragment.frag -o build/vulkan-smoke/fragment.spv
      - name: Run Vulkan graphics capture smoke test
        env:
          VK_LAYER_PATH: ${{ github.workspace }}/build/vulkan-install/share/vulkan/explicit_layer.d
          LD_LIBRARY_PATH: ${{ github.workspace }}/build/vulkan-install/lib
          VK_INSTANCE_LAYERS: VK_LAYER_SCSKILLER
          NODEVICE_SELECT: "1"
          SCSKILLER_VK_RECORD: "1"
          SCSKILLER_VK_RECORD_FILE: ${{ github.workspace }}/build/vulkan-smoke/graphics-capture.jsonl
        run: |
          timeout 60s build/vulkan-probe/scskiller-vulkan-probe --graphics             build/vulkan-smoke/vertex.spv build/vulkan-smoke/fragment.spv
          test -s build/vulkan-smoke/graphics-capture.jsonl
          grep -q '"event":"shader_module_code"' build/vulkan-smoke/graphics-capture.jsonl
          grep -q '"event":"render_pass_create"' build/vulkan-smoke/graphics-capture.jsonl
          grep -q '"event":"graphics_pipeline_state"' build/vulkan-smoke/graphics-capture.jsonl
      - name: Run Vulkan dynamic-rendering capture smoke test
        env:
          VK_LAYER_PATH: ${{ github.workspace }}/build/vulkan-install/share/vulkan/explicit_layer.d
          LD_LIBRARY_PATH: ${{ github.workspace }}/build/vulkan-install/lib
          VK_INSTANCE_LAYERS: VK_LAYER_SCSKILLER
          SCSKILLER_VK_RECORD: "1"
          SCSKILLER_VK_RECORD_FILE: ${{ github.workspace }}/build/vulkan-smoke/dynamic-graphics-capture.jsonl
        run: |
          timeout 60s build/vulkan-probe/scskiller-vulkan-probe --dynamic-graphics build/vulkan-smoke/vertex.spv build/vulkan-smoke/fragment.spv
          test -s build/vulkan-smoke/dynamic-graphics-capture.jsonl
          grep -q '"event":"graphics_pipeline_state"' build/vulkan-smoke/dynamic-graphics-capture.jsonl
          grep -q '"dynamic_rendering":{"' build/vulkan-smoke/dynamic-graphics-capture.jsonl

      - name: Replay captured dynamic-rendering pipeline with Vulkan warmer
        run: |
          timeout 60s build/vulkan-warmer/scskiller-vulkan-warmer \
            build/vulkan-smoke/dynamic-graphics-capture.jsonl \
            - \
            build/vulkan-smoke/dynamic-graphics-warmed.cache.bin \
            > build/vulkan-smoke/dynamic-replay.log 2>&1
          cat build/vulkan-smoke/dynamic-replay.log
          test -s build/vulkan-smoke/dynamic-graphics-warmed.cache.bin
          grep -q 'Graphics replay: requested 1, compiled 1, skipped 0, failed 0' build/vulkan-smoke/dynamic-replay.log
      - name: Inspect graphics recordings and shader correlations
        run: |
          dotnet run --project src/SCSKiller.Linux.Cli/SCSKiller.Linux.Cli.csproj -c Release -- \
            inspect-vulkan build/vulkan-smoke/graphics-capture.jsonl > build/vulkan-smoke/graphics-inspect.log
          cat build/vulkan-smoke/graphics-inspect.log
          grep -q 'Graphics pipelines: 1' build/vulkan-smoke/graphics-inspect.log
          grep -q 'Pipelines with missing SPIR-V bytes: 0' build/vulkan-smoke/graphics-inspect.log
          dotnet run --project src/SCSKiller.Linux.Cli/SCSKiller.Linux.Cli.csproj -c Release -- \
            inspect-vulkan build/vulkan-smoke/dynamic-graphics-capture.jsonl > build/vulkan-smoke/dynamic-graphics-inspect.log
          cat build/vulkan-smoke/dynamic-graphics-inspect.log
          grep -q 'dynamic rendering: 1' build/vulkan-smoke/dynamic-graphics-inspect.log
          grep -q 'Pipelines with missing SPIR-V bytes: 0' build/vulkan-smoke/dynamic-graphics-inspect.log

      - name: Plan classic and dynamic Vulkan graphics captures
        run: |
          dotnet run --project src/SCSKiller.Linux.Cli/SCSKiller.Linux.Cli.csproj -c Release -- \
            plan-vulkan build/vulkan-smoke/graphics-capture.jsonl > build/vulkan-smoke/graphics-plan.log
          grep -q 'Pipeline plan: 1 total; 1 replayable; 0 unsupported' build/vulkan-smoke/graphics-plan.log
          grep -Eq 'graphics id=[0-9a-f]{16} status=replayable' build/vulkan-smoke/graphics-plan.log
          dotnet run --project src/SCSKiller.Linux.Cli/SCSKiller.Linux.Cli.csproj -c Release -- \
            plan-vulkan build/vulkan-smoke/dynamic-graphics-capture.jsonl > build/vulkan-smoke/dynamic-graphics-plan.log
          grep -q 'Pipeline plan: 1 total; 1 replayable; 0 unsupported' build/vulkan-smoke/dynamic-graphics-plan.log
          grep -Eq 'graphics id=[0-9a-f]{16} status=replayable' build/vulkan-smoke/dynamic-graphics-plan.log

      - name: Skip dynamic-rendering pipelines with nested unsupported pNext state
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          source = Path("build/vulkan-smoke/dynamic-graphics-capture.jsonl")
          target = Path("build/vulkan-smoke/dynamic-pnext-capture.jsonl")
          changed = False
          output = []
          for line in source.read_text().splitlines():
              record = json.loads(line)
              if not changed and record.get("event") == "graphics_pipeline_state":
                  record["pipelines"][0]["dynamic_rendering"]["pnext_present"] = True
                  changed = True
              output.append(json.dumps(record, separators=(",", ":")))
          if not changed:
              raise SystemExit("No graphics_pipeline_state event found")
          target.write_text("\n".join(output) + "\n")
          PY
          timeout 60s build/vulkan-warmer/scskiller-vulkan-warmer \
            build/vulkan-smoke/dynamic-pnext-capture.jsonl \
            - \
            build/vulkan-smoke/dynamic-pnext-warmed.cache.bin \
            > build/vulkan-smoke/dynamic-pnext-replay.log 2>&1
          grep -q 'Graphics replay: requested 1, compiled 0, skipped 1, failed 0' build/vulkan-smoke/dynamic-pnext-replay.log
          dotnet run --project src/SCSKiller.Linux.Cli/SCSKiller.Linux.Cli.csproj -c Release -- \
            plan-vulkan build/vulkan-smoke/dynamic-pnext-capture.jsonl > build/vulkan-smoke/dynamic-pnext-plan.log
          grep -q 'Pipeline plan: 1 total; 0 replayable; 1 unsupported' build/vulkan-smoke/dynamic-pnext-plan.log
          grep -Eq 'graphics id=[0-9a-f]{16} status=unsupported.*reasons=unsupported-pipeline-pnext' build/vulkan-smoke/dynamic-pnext-plan.log

      - name: Inspect captured Vulkan recording via the managed CLI
        run: |
          dotnet run --project src/SCSKiller.Linux.Cli/SCSKiller.Linux.Cli.csproj -c Release -- \
            inspect-vulkan build/vulkan-smoke/capture.jsonl > build/vulkan-smoke/inspect.log
          cat build/vulkan-smoke/inspect.log
          grep -q 'Unique captured SPIR-V modules: 1' build/vulkan-smoke/inspect.log
          grep -q 'Compute pipelines: 1' build/vulkan-smoke/inspect.log

      - name: Plan captured Vulkan compute pipeline
        run: |
          dotnet run --project src/SCSKiller.Linux.Cli/SCSKiller.Linux.Cli.csproj -c Release -- \
            plan-vulkan build/vulkan-smoke/capture.jsonl > build/vulkan-smoke/compute-plan.log
          grep -q 'Pipeline plan: 1 total; 1 replayable; 0 unsupported' build/vulkan-smoke/compute-plan.log
          grep -Eq 'compute id=[0-9a-f]{16} status=replayable' build/vulkan-smoke/compute-plan.log
      - name: Replay captured compute pipeline with Vulkan warmer
        run: |
          timeout 60s build/vulkan-warmer/scskiller-vulkan-warmer \
            build/vulkan-smoke/capture.jsonl \
            - \
            build/vulkan-smoke/warmed.cache.bin
          test -s build/vulkan-smoke/warmed.cache.bin
      - name: Merge warmed cache into an application-supplied cache
        env:
          VK_LAYER_PATH: ${{ github.workspace }}/build/vulkan-install/share/vulkan/explicit_layer.d
          LD_LIBRARY_PATH: ${{ github.workspace }}/build/vulkan-install/lib
          VK_INSTANCE_LAYERS: VK_LAYER_SCSKILLER
          NODEVICE_SELECT: "1"
          SCSKILLER_VK_REPLAY_CACHE: ${{ github.workspace }}/build/vulkan-smoke/warmed.cache.bin
          SCSKILLER_PROBE_APP_CACHE: ${{ github.workspace }}/build/vulkan-smoke/warmed.cache.bin
          SCSKILLER_VK_RECORD: "1"
          SCSKILLER_VK_RECORD_FILE: ${{ github.workspace }}/build/vulkan-smoke/merged-app-cache.jsonl
        run: |
          rm -f build/vulkan-smoke/merged-app-cache.jsonl
          timeout 60s build/vulkan-probe/scskiller-vulkan-probe build/vulkan-smoke/compute.spv
          test -s build/vulkan-smoke/merged-app-cache.jsonl
          grep -q '"event":"pipeline_cache_merge"' build/vulkan-smoke/merged-app-cache.jsonl
          ! grep -q '"event":"pipeline_cache_merge_skipped"' build/vulkan-smoke/merged-app-cache.jsonl
          dotnet run --project src/SCSKiller.Linux.Cli/SCSKiller.Linux.Cli.csproj -c Release -- \
            inspect-vulkan build/vulkan-smoke/merged-app-cache.jsonl > build/vulkan-smoke/merged-app-cache-inspect.log
          grep -q 'Driver cache injections/merges: 1; skipped: 0' build/vulkan-smoke/merged-app-cache-inspect.log

      - name: Skip compute pipelines with unsupported pipeline-level pNext state
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          source = Path("build/vulkan-smoke/capture.jsonl")
          target = Path("build/vulkan-smoke/unsupported-pipeline-pnext.jsonl")
          changed = False
          output = []
          for line in source.read_text().splitlines():
              record = json.loads(line)
              if not changed and record.get("event") == "compute_pipeline_state":
                  pipeline = record["pipelines"][0]
                  pipeline["pipeline_pnext_present"] = True
                  pipeline["pipeline_pnext_compatible"] = False
                  pipeline["replay_compatible"] = False
                  changed = True
              output.append(json.dumps(record, separators=(",", ":")))
          if not changed:
              raise SystemExit("No compute_pipeline_state event found")
          target.write_text("\n".join(output) + "\n")
          PY
          timeout 60s build/vulkan-warmer/scskiller-vulkan-warmer \
            build/vulkan-smoke/unsupported-pipeline-pnext.jsonl - \
            build/vulkan-smoke/unsupported-pipeline-pnext.cache.bin \
            > build/vulkan-smoke/unsupported-pipeline-pnext-replay.log 2>&1
          grep -q 'Compute replay: requested 1, compiled 0, skipped 1, failed 0' build/vulkan-smoke/unsupported-pipeline-pnext-replay.log
          dotnet run --project src/SCSKiller.Linux.Cli/SCSKiller.Linux.Cli.csproj -c Release -- \
            plan-vulkan build/vulkan-smoke/unsupported-pipeline-pnext.jsonl > build/vulkan-smoke/unsupported-pipeline-pnext-plan.log
          grep -q 'Pipeline plan: 1 total; 0 replayable; 1 unsupported' build/vulkan-smoke/unsupported-pipeline-pnext-plan.log
          grep -q 'unsupported-pipeline-pnext: 1' build/vulkan-smoke/unsupported-pipeline-pnext-plan.log
          grep -Eq 'compute id=[0-9a-f]{16} status=unsupported.*reasons=.*unsupported-pipeline-pnext' build/vulkan-smoke/unsupported-pipeline-pnext-plan.log

      - name: Skip pipelines when a recorded descriptor layout is incompatible
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          source = Path("build/vulkan-smoke/capture.jsonl")
          target = Path("build/vulkan-smoke/incompatible-layout-capture.jsonl")
          changed = False
          output = []
          for line in source.read_text().splitlines():
              record = json.loads(line)
              if not changed and record.get("event") == "descriptor_set_layout_create":
                  record["replay_compatible"] = False
                  changed = True
              output.append(json.dumps(record, separators=(",", ":")))
          if not changed:
              raise SystemExit("No descriptor_set_layout_create event found")
          target.write_text("\n".join(output) + "\n")
          PY
          timeout 60s build/vulkan-warmer/scskiller-vulkan-warmer \
            build/vulkan-smoke/incompatible-layout-capture.jsonl \
            - \
            build/vulkan-smoke/incompatible-layout-warmed.cache.bin \
            > build/vulkan-smoke/incompatible-layout-replay.log 2>&1
          cat build/vulkan-smoke/incompatible-layout-replay.log
          grep -q 'Compute replay: requested 1, compiled 0, skipped 1, failed 0' build/vulkan-smoke/incompatible-layout-replay.log
          dotnet run --project src/SCSKiller.Linux.Cli/SCSKiller.Linux.Cli.csproj -c Release -- \
            plan-vulkan build/vulkan-smoke/incompatible-layout-capture.jsonl > build/vulkan-smoke/incompatible-layout-plan.log
          grep -q 'Pipeline plan: 1 total; 0 replayable; 1 unsupported' build/vulkan-smoke/incompatible-layout-plan.log
          grep -q 'incompatible-pipeline-layout: 1' build/vulkan-smoke/incompatible-layout-plan.log
          grep -Eq 'compute id=[0-9a-f]{16} status=unsupported.*reasons=incompatible-pipeline-layout' build/vulkan-smoke/incompatible-layout-plan.log
      - name: Require complete replay through managed Vulkan warmer
        run: |
          if timeout 60s dotnet run --project src/SCSKiller.Linux.Cli/SCSKiller.Linux.Cli.csproj -c Release -- \
            warm-vulkan build/vulkan-smoke/incompatible-layout-capture.jsonl \
            --warmer build/vulkan-warmer/scskiller-vulkan-warmer \
            --require-complete > build/vulkan-smoke/strict-replay.log 2>&1; then
            echo "Strict replay unexpectedly accepted skipped pipelines" >&2
            exit 1
          fi
          cat build/vulkan-smoke/strict-replay.log
          grep -q 'Incomplete Vulkan replay:' build/vulkan-smoke/strict-replay.log
      - name: Replay driver cache through Vulkan layer
        env:
          VK_LAYER_PATH: ${{ github.workspace }}/build/vulkan-install/share/vulkan/explicit_layer.d
          LD_LIBRARY_PATH: ${{ github.workspace }}/build/vulkan-install/lib
          VK_INSTANCE_LAYERS: VK_LAYER_SCSKILLER
          NODEVICE_SELECT: "1"
          SCSKILLER_VK_DEBUG: "1"
          VK_LOADER_DEBUG: "all"
          SCSKILLER_VK_REPLAY_CACHE: ${{ github.workspace }}/build/vulkan-smoke/warmed.cache.bin
          SCSKILLER_VK_RECORD: "1"
          SCSKILLER_VK_RECORD_FILE: ${{ github.workspace }}/build/vulkan-smoke/cache-replay-capture.jsonl
        run: |
          rm -f build/vulkan-smoke/cache-replay-capture.jsonl

          timeout 60s build/vulkan-probe/scskiller-vulkan-probe build/vulkan-smoke/compute.spv
          test -s build/vulkan-smoke/cache-replay-capture.jsonl
          grep -q '"event":"pipeline_cache_replay"' build/vulkan-smoke/cache-replay-capture.jsonl
      - name: Launch native Vulkan process through managed cache launcher
        env:
          SCSKILLER_VK_RECORD: "1"
          SCSKILLER_VK_RECORD_FILE: ${{ github.workspace }}/build/vulkan-smoke/managed-cache-launch.jsonl
          NODEVICE_SELECT: "1"
        run: |
          rm -f build/vulkan-smoke/managed-cache-launch.jsonl
          timeout 60s dotnet run --project src/SCSKiller.Linux.Cli/SCSKiller.Linux.Cli.csproj -c Release -- \
            run-vulkan build/vulkan-probe/scskiller-vulkan-probe \
            ${{ github.workspace }} \
            ${{ github.workspace }}/build/vulkan-install/share/vulkan/explicit_layer.d \
            build/vulkan-smoke/warmed.cache.bin \
            build/vulkan-smoke/compute.spv
          test -s build/vulkan-smoke/managed-cache-launch.jsonl
          grep -q '"event":"pipeline_cache_replay"' build/vulkan-smoke/managed-cache-launch.jsonl
      - name: Launch Proton game through managed cache launcher
        env:
          SCSKILLER_VK_RECORD: "1"
          SCSKILLER_VK_RECORD_FILE: ${{ github.workspace }}/build/vulkan-smoke/managed-proton-cache-launch.jsonl
          NODEVICE_SELECT: "1"
        run: |
          cat > build/vulkan-smoke/proton-mock <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          [[ "${1:-}" == "run" ]] || { echo "expected Proton run subcommand" >&2; exit 2; }
          shift
          test -n "${STEAM_COMPAT_DATA_PATH:-}"
          test -n "${SCSKILLER_VK_REPLAY_CACHE:-}"
          test "${VK_INSTANCE_LAYERS:-}" = "VK_LAYER_SCSKILLER"
          exec "$@"
          EOF
          chmod +x build/vulkan-smoke/proton-mock
          rm -f build/vulkan-smoke/managed-proton-cache-launch.jsonl
          timeout 60s dotnet run --project src/SCSKiller.Linux.Cli/SCSKiller.Linux.Cli.csproj -c Release -- \
            run-proton-vulkan build/vulkan-smoke/proton-mock \
            build/vulkan-smoke/mock-compatdata \
            ${{ github.workspace }} \
            build/vulkan-probe/scskiller-vulkan-probe \
            ${{ github.workspace }}/build/vulkan-install/share/vulkan/explicit_layer.d \
            build/vulkan-smoke/warmed.cache.bin \
            build/vulkan-smoke/compute.spv
          test -s build/vulkan-smoke/managed-proton-cache-launch.jsonl
          grep -q '"event":"pipeline_cache_replay"' build/vulkan-smoke/managed-proton-cache-launch.jsonl
      - name: Reject incompatible driver cache without breaking the app
        env:
          VK_LAYER_PATH: ${{ github.workspace }}/build/vulkan-install/share/vulkan/explicit_layer.d
          LD_LIBRARY_PATH: ${{ github.workspace }}/build/vulkan-install/lib
          VK_INSTANCE_LAYERS: VK_LAYER_SCSKILLER
          NODEVICE_SELECT: "1"
          SCSKILLER_VK_REPLAY_CACHE: ${{ github.workspace }}/build/vulkan-smoke/invalid-cache.bin
          SCSKILLER_VK_RECORD: "1"
          SCSKILLER_VK_RECORD_FILE: ${{ github.workspace }}/build/vulkan-smoke/cache-rejected-capture.jsonl
        run: |
          python3 - <<'PY'
          from pathlib import Path
          Path("build/vulkan-smoke/invalid-cache.bin").write_bytes(bytes(32))
          PY
          timeout 60s build/vulkan-probe/scskiller-vulkan-probe build/vulkan-smoke/compute.spv
          test -s build/vulkan-smoke/cache-rejected-capture.jsonl
          grep -q '"event":"pipeline_cache_replay_skipped"' build/vulkan-smoke/cache-rejected-capture.jsonl
      - name: Replay captured graphics pipeline with Vulkan warmer
        run: |
          timeout 60s build/vulkan-warmer/scskiller-vulkan-warmer \
            build/vulkan-smoke/graphics-capture.jsonl \
            - \
            build/vulkan-smoke/graphics-warmed.cache.bin \
            > build/vulkan-smoke/graphics-replay.log 2>&1
          cat build/vulkan-smoke/graphics-replay.log
          test -s build/vulkan-smoke/graphics-warmed.cache.bin
          grep -q 'Graphics replay: requested 1, compiled 1, skipped 0, failed 0' build/vulkan-smoke/graphics-replay.log
      - name: Exercise C# Vulkan warmer integration in CI
        run: |
          timeout 60s dotnet run --project src/SCSKiller.Linux.Cli/SCSKiller.Linux.Cli.csproj -c Release -- \
            warm-vulkan build/vulkan-smoke/capture.jsonl \
            --output-cache build/vulkan-smoke/managed-warmed.cache.bin \
            --warmer ${{ github.workspace }}/build/vulkan-warmer/scskiller-vulkan-warmer
          test -s build/vulkan-smoke/managed-warmed.cache.bin
      - name: Exercise native Vulkan recording through the managed CLI
        env:
          NODEVICE_SELECT: "1"
          SCSKILLER_VK_DEBUG: "1"
          VK_LOADER_DEBUG: "all"
          VK_INSTANCE_LAYERS: VK_LAYER_SCSKILLER
          VK_LAYER_PATH: ${{ github.workspace }}/build/vulkan-install/share/vulkan/explicit_layer.d
          LD_LIBRARY_PATH: ${{ github.workspace }}/build/vulkan-install/lib
        run: |
          echo "Managed recorder layer dir: ${{ github.workspace }}/build/vulkan-install/share/vulkan/explicit_layer.d"
          timeout 60s dotnet run --project src/SCSKiller.Linux.Cli/SCSKiller.Linux.Cli.csproj -c Release -- \
            record-vulkan build/vulkan-probe/scskiller-vulkan-probe \
            ${{ github.workspace }} \
            ${{ github.workspace }}/build/vulkan-install/share/vulkan/explicit_layer.d \
            build/vulkan-smoke/managed-\"native\"-capture.jsonl \
            build/vulkan-smoke/compute.spv
          test -s build/vulkan-smoke/managed-\"native\"-capture.jsonl
          cat build/vulkan-smoke/managed-\"native\"-capture.jsonl
          grep -q '"event":"compute_pipeline_state"' build/vulkan-smoke/managed-\"native\"-capture.jsonl
          dotnet run --project src/SCSKiller.Linux.Cli/SCSKiller.Linux.Cli.csproj -c Release -- \
            inspect-vulkan build/vulkan-smoke/managed-\"native\"-capture.jsonl > build/vulkan-smoke/managed-inspect.log
          grep -q 'Compute pipelines: 1' build/vulkan-smoke/managed-inspect.log
      - name: Exercise Proton Vulkan recording through managed CLI
        env:
          NODEVICE_SELECT: "1"
          VK_INSTANCE_LAYERS: VK_LAYER_SCSKILLER
          VK_LAYER_PATH: ${{ github.workspace }}/build/vulkan-install/share/vulkan/explicit_layer.d
          LD_LIBRARY_PATH: ${{ github.workspace }}/build/vulkan-install/lib
        run: |
          cat > build/vulkan-smoke/proton-record-mock <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          [[ "${1:-}" == "run" ]] || { echo "expected Proton run subcommand" >&2; exit 2; }
          shift
          test -n "${STEAM_COMPAT_DATA_PATH:-}"
          test "${SCSKILLER_VK_RECORD:-}" = "1"
          test "${VK_INSTANCE_LAYERS:-}" = "VK_LAYER_SCSKILLER"
          exec "$@"
          EOF
          chmod +x build/vulkan-smoke/proton-record-mock
          rm -f build/vulkan-smoke/managed-proton-record.jsonl
          timeout 60s dotnet run --project src/SCSKiller.Linux.Cli/SCSKiller.Linux.Cli.csproj -c Release -- \
            record-proton build/vulkan-smoke/proton-record-mock \
            build/vulkan-smoke/mock-compatdata \
            ${{ github.workspace }} \
            build/vulkan-probe/scskiller-vulkan-probe \
            ${{ github.workspace }}/build/vulkan-install/share/vulkan/explicit_layer.d \
            build/vulkan-smoke/managed-proton-record.jsonl \
            build/vulkan-smoke/compute.spv
          test -s build/vulkan-smoke/managed-proton-record.jsonl
          grep -q '"event":"compute_pipeline_state"' build/vulkan-smoke/managed-proton-record.jsonl
          dotnet run --project src/SCSKiller.Linux.Cli/SCSKiller.Linux.Cli.csproj -c Release -- \
            inspect-vulkan build/vulkan-smoke/managed-proton-record.jsonl > build/vulkan-smoke/managed-proton-record-inspect.log
          grep -q 'Compute pipelines: 1' build/vulkan-smoke/managed-proton-record-inspect.log

      - name: Validate concurrent-process Vulkan recording
        env:
          VK_LAYER_PATH: ${{ github.workspace }}/build/vulkan-install/share/vulkan/explicit_layer.d
          LD_LIBRARY_PATH: ${{ github.workspace }}/build/vulkan-install/lib
          VK_INSTANCE_LAYERS: VK_LAYER_SCSKILLER
          NODEVICE_SELECT: "1"
        run: |
          capture=build/vulkan-smoke/multiprocess-capture.jsonl
          rm -f "$capture" "$capture".cache.*.bin
          SCSKILLER_VK_RECORD=1 SCSKILLER_VK_RECORD_FILE="$capture" \
            timeout 60s build/vulkan-probe/scskiller-vulkan-probe build/vulkan-smoke/compute.spv \
            > build/vulkan-smoke/multiprocess-1.log 2>&1 &
          pid1=$!
          SCSKILLER_VK_RECORD=1 SCSKILLER_VK_RECORD_FILE="$capture" \
            timeout 60s build/vulkan-probe/scskiller-vulkan-probe build/vulkan-smoke/compute.spv \
            > build/vulkan-smoke/multiprocess-2.log 2>&1 &
          pid2=$!
          wait "$pid1"
          wait "$pid2"
          python3 - <<'PY'
          import glob
          import json
          from pathlib import Path
          capture = Path("build/vulkan-smoke/multiprocess-capture.jsonl")
          events = [json.loads(line) for line in capture.read_text().splitlines() if line.strip()]
          assert sum(e.get("event") == "compute_pipeline_state" for e in events) == 2, "expected two compute pipeline events"
          assert sum(e.get("event") == "pipeline_cache_snapshot" for e in events) == 2, "expected two cache snapshot events"
          snapshots = glob.glob(str(capture) + ".cache.*.bin")
          assert len(snapshots) >= 2, f"expected process-unique cache snapshots, got {snapshots}"
          print(f"Parsed {len(events)} JSONL events and {len(snapshots)} process-unique cache snapshots")
          PY
          dotnet run --project src/SCSKiller.Linux.Cli/SCSKiller.Linux.Cli.csproj -c Release -- \
            inspect-vulkan "$capture" > build/vulkan-smoke/multiprocess-inspect.log
          grep -q 'Compute pipelines: 2' build/vulkan-smoke/multiprocess-inspect.log

      - name: Stage and smoke-test Linux package
        env:
          STAGE: ${{ github.workspace }}/build/package-smoke
          BUILD_ROOT: ${{ github.workspace }}/build/package-native
        run: |
          guard_bin="${GITHUB_WORKSPACE}/build/package-guard-bin"
          mkdir -p "$guard_bin"
          cat > "$guard_bin/rm" <<'EOF'
          #!/usr/bin/env bash
          printf '%s\n' "$*" >> "$SCSKILLER_GUARD_RM_LOG"
          exit 97
          EOF
          chmod +x "$guard_bin/rm"
          assert_stage_rejected() {
            local stage_path="$1"
            local build_path="$2"
            local rm_log="${GITHUB_WORKSPACE}/build/package-guard-rm.log"
            rm -f "$rm_log"
            if PATH="$guard_bin:$PATH" \
              SCSKILLER_GUARD_RM_LOG="$rm_log" \
              STAGE="$stage_path" BUILD_ROOT="$build_path" \
              bash scripts/package-linux.sh; then
              echo "Packaging unexpectedly accepted unsafe STAGE=$stage_path BUILD_ROOT=$build_path" >&2
              exit 1
            fi
            if test -e "$rm_log"; then
              echo "Packaging attempted rm before rejecting unsafe STAGE=$stage_path" >&2
              cat "$rm_log" >&2
              exit 1
            fi
          }
          assert_stage_rejected "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/build/package-guard"
          assert_stage_rejected "$(dirname "$GITHUB_WORKSPACE")" "$GITHUB_WORKSPACE/build/package-guard"
          assert_stage_rejected "$GITHUB_WORKSPACE/build/package-guard-overlap" "$GITHUB_WORKSPACE/build/package-guard-overlap/build"
          assert_stage_rejected "$GITHUB_WORKSPACE/build/package-guard-overlap/output" "$GITHUB_WORKSPACE/build/package-guard-overlap"
          assert_stage_rejected "$GITHUB_WORKSPACE/build/package-safe-stage" "$GITHUB_WORKSPACE"
          unrelated_stage="$GITHUB_WORKSPACE/build/package-unrelated-stage"
          mkdir -p "$unrelated_stage"
          printf 'do not erase me\\n' > "$unrelated_stage/KEEP-ME"
          assert_stage_rejected "$unrelated_stage" "$GITHUB_WORKSPACE/build/package-guard"
          grep -q 'do not erase me' "$unrelated_stage/KEEP-ME"
          bash scripts/package-linux.sh
          test -x build/package-smoke/bin/scskiller-linux
          test -x build/package-smoke/libexec/cli/scskiller-linux
          test -s build/package-smoke/lib/VK_LAYER_SCSKILLER.so
          test -s build/package-smoke/share/vulkan/explicit_layer.d/layer.json
          test -s build/package-smoke/share/doc/scskiller-linux/LICENSE
          test -s build/package-smoke/share/doc/scskiller-linux/LICENSE-EXCEPTION.txt
          test -s build/package-smoke/share/doc/scskiller-linux/THIRD-PARTY-NOTICES.md
          test -x build/package-smoke/bin/scskiller-vulkan-warmer
          test -x build/package-smoke/install-user-package.sh
          build/package-smoke/bin/scskiller-linux help
          install_home="${GITHUB_WORKSPACE}/build/package-install-home"
          HOME="$install_home" \
            DEST="$install_home/.local/opt/scskiller-linux" \
            BIN_DIR="$install_home/.local/bin" \
            APPLICATIONS_DIR="$install_home/.local/share/applications" \
            bash build/package-smoke/install-user-package.sh "$GITHUB_WORKSPACE/build/package-smoke"
          test -x "$install_home/.local/opt/scskiller-linux/bin/scskiller-linux"
          test -L "$install_home/.local/bin/scskiller-linux"
          "$install_home/.local/bin/scskiller-linux" help
          timeout 60s build/package-smoke/bin/scskiller-linux warm-vulkan build/vulkan-smoke/capture.jsonl \
            --output-cache build/vulkan-smoke/package-warmed.cache.bin
          test -s build/vulkan-smoke/package-warmed.cache.bin
      - name: Upload experimental Linux package
        uses: actions/upload-artifact@v4
        with:
          name: scskiller-linux-${{ github.sha }}
          path: build/package-smoke/
          if-no-files-found: error
          retention-days: 14
