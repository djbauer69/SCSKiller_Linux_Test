name: Linux

on:
  push:
    branches: [ linux-vulkan-proton ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Vulkan development files
        run: sudo apt-get update && sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers glslc cmake ninja-build
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x
      - name: Build managed Linux projects
        run: dotnet build src/SCSKiller.Graphics/SCSKiller.Graphics.csproj -c Release
      - name: Build Linux CLI
        run: dotnet build src/SCSKiller.Linux.Cli/SCSKiller.Linux.Cli.csproj -c Release
      - name: Configure native Vulkan layer
        run: cmake -S native/vulkan-layer -B build/vulkan-layer -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build native Vulkan layer
        run: cmake --build build/vulkan-layer
      - name: Inspect Vulkan layer ABI exports
        run: |
          nm -D --defined-only build/vulkan-layer/VK_LAYER_SCSKILLER.so | grep -E 'vk(CreateInstance|GetInstanceProcAddr|NegotiateLoaderLayerInterfaceVersion|layerGetPhysicalDeviceProcAddr)'
          python3 - <<'PY'
          import ctypes
          lib = ctypes.CDLL("build/vulkan-layer/VK_LAYER_SCSKILLER.so")
          gipa = lib.vkGetInstanceProcAddr
          gipa.argtypes = [ctypes.c_void_p, ctypes.c_char_p]
          gipa.restype = ctypes.c_void_p
          assert gipa(None, b"vkCreateInstance"), "layer GIPA did not return vkCreateInstance"
          print("Layer ABI GIPA returned vkCreateInstance")
          PY
      - name: Configure Vulkan probe
        run: cmake -S native/vulkan-probe -B build/vulkan-probe -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build Vulkan probe
        run: cmake --build build/vulkan-probe
      - name: Configure Vulkan warmer
        run: cmake -S native/vulkan-warmer -B build/vulkan-warmer -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build Vulkan warmer
        run: cmake --build build/vulkan-warmer
      - name: Install Vulkan layer for loader smoke test
        run: cmake --install build/vulkan-layer --prefix build/vulkan-install
      - name: Compile Vulkan smoke shader
        run: |
          mkdir -p build/vulkan-smoke
          cat > build/vulkan-smoke/compute.comp <<'EOF'
          #version 450
          layout(local_size_x = 1, local_size_y = 1, local_size_z = 1) in;
          void main() {}
          EOF
          glslc -fshader-stage=compute build/vulkan-smoke/compute.comp -o build/vulkan-smoke/compute.spv
      - name: Run Vulkan loader smoke test with SCSKiller layer
        env:
          VK_LAYER_PATH: ${{ github.workspace }}/build/vulkan-install/share/vulkan/explicit_layer.d
          LD_LIBRARY_PATH: ${{ github.workspace }}/build/vulkan-install/lib
          VK_INSTANCE_LAYERS: VK_LAYER_SCSKILLER
          NODEVICE_SELECT: "1"
          SCSKILLER_VK_RECORD: "1"
          SCSKILLER_VK_RECORD_FILE: ${{ github.workspace }}/build/vulkan-smoke/capture.jsonl
          SCSKILLER_VK_DEBUG: "1"
          VK_LOADER_DEBUG: "all"
        run: |
          timeout 60s build/vulkan-probe/scskiller-vulkan-probe build/vulkan-smoke/compute.spv
          test -s build/vulkan-smoke/capture.jsonl
          grep -q '"event":"shader_module_create"' build/vulkan-smoke/capture.jsonl
          grep -q '"event":"shader_module_code"' build/vulkan-smoke/capture.jsonl
          grep -q '"event":"descriptor_set_layout_create"' build/vulkan-smoke/capture.jsonl
          grep -q '"event":"pipeline_layout_create"' build/vulkan-smoke/capture.jsonl
          grep -q '"event":"compute_pipeline_state"' build/vulkan-smoke/capture.jsonl
          grep -q '"event":"pipeline_cache_snapshot"' build/vulkan-smoke/capture.jsonl
      - name: Compile Vulkan graphics smoke shaders
        run: |
          cat > build/vulkan-smoke/vertex.vert <<'EOF'
          #version 450
          void main() {
              gl_Position = vec4(0.0, 0.0, 0.0, 1.0);
          }
          EOF
          cat > build/vulkan-smoke/fragment.frag <<'EOF'
          #version 450
          layout(location = 0) out vec4 outColor;
          void main() {
              outColor = vec4(1.0, 0.0, 1.0, 1.0);
          }
          EOF
          glslc -fshader-stage=vertex build/vulkan-smoke/vertex.vert -o build/vulkan-smoke/vertex.spv
          glslc -fshader-stage=fragment build/vulkan-smoke/fragment.frag -o build/vulkan-smoke/fragment.spv
      - name: Run Vulkan graphics capture smoke test
        env:
          VK_LAYER_PATH: ${{ github.workspace }}/build/vulkan-install/share/vulkan/explicit_layer.d
          LD_LIBRARY_PATH: ${{ github.workspace }}/build/vulkan-install/lib
          VK_INSTANCE_LAYERS: VK_LAYER_SCSKILLER
          NODEVICE_SELECT: "1"
          SCSKILLER_VK_RECORD: "1"
          SCSKILLER_VK_RECORD_FILE: ${{ github.workspace }}/build/vulkan-smoke/graphics-capture.jsonl
        run: |
          timeout 60s build/vulkan-probe/scskiller-vulkan-probe --graphics             build/vulkan-smoke/vertex.spv build/vulkan-smoke/fragment.spv
          test -s build/vulkan-smoke/graphics-capture.jsonl
          grep -q '"event":"shader_module_code"' build/vulkan-smoke/graphics-capture.jsonl
          grep -q '"event":"render_pass_create"' build/vulkan-smoke/graphics-capture.jsonl
          grep -q '"event":"graphics_pipeline_state"' build/vulkan-smoke/graphics-capture.jsonl
      - name: Run Vulkan dynamic-rendering capture smoke test
        env:
          VK_LAYER_PATH: ${{ github.workspace }}/build/vulkan-install/share/vulkan/explicit_layer.d
          LD_LIBRARY_PATH: ${{ github.workspace }}/build/vulkan-install/lib
          VK_INSTANCE_LAYERS: VK_LAYER_SCSKILLER
          SCSKILLER_VK_RECORD: "1"
          SCSKILLER_VK_RECORD_FILE: ${{ github.workspace }}/build/vulkan-smoke/dynamic-graphics-capture.jsonl
        run: |
          timeout 60s build/vulkan-probe/scskiller-vulkan-probe --dynamic-graphics build/vulkan-smoke/vertex.spv build/vulkan-smoke/fragment.spv
          test -s build/vulkan-smoke/dynamic-graphics-capture.jsonl
          grep -q '"event":"graphics_pipeline_state"' build/vulkan-smoke/dynamic-graphics-capture.jsonl
          grep -q '"dynamic_rendering":{"' build/vulkan-smoke/dynamic-graphics-capture.jsonl

      - name: Replay captured dynamic-rendering pipeline with Vulkan warmer
        run: |
          timeout 60s build/vulkan-warmer/scskiller-vulkan-warmer \
            build/vulkan-smoke/dynamic-graphics-capture.jsonl \
            - \
            build/vulkan-smoke/dynamic-graphics-warmed.cache.bin \
            > build/vulkan-smoke/dynamic-replay.log 2>&1
          cat build/vulkan-smoke/dynamic-replay.log
          test -s build/vulkan-smoke/dynamic-graphics-warmed.cache.bin
          grep -q 'Graphics replay: requested 1, compiled 1, skipped 0, failed 0' build/vulkan-smoke/dynamic-replay.log
      - name: Inspect captured Vulkan recording via the managed CLI
        run: |
          dotnet run --project src/SCSKiller.Linux.Cli/SCSKiller.Linux.Cli.csproj -c Release -- \
            inspect-vulkan build/vulkan-smoke/capture.jsonl > build/vulkan-smoke/inspect.log
          cat build/vulkan-smoke/inspect.log
          grep -q 'Unique captured SPIR-V modules: 1' build/vulkan-smoke/inspect.log
          grep -q 'Compute pipelines: 1' build/vulkan-smoke/inspect.log

      - name: Replay captured compute pipeline with Vulkan warmer
        run: |
          timeout 60s build/vulkan-warmer/scskiller-vulkan-warmer \
            build/vulkan-smoke/capture.jsonl \
            - \
            build/vulkan-smoke/warmed.cache.bin
          test -s build/vulkan-smoke/warmed.cache.bin
      - name: Replay driver cache through Vulkan layer
        env:
          VK_LAYER_PATH: ${{ github.workspace }}/build/vulkan-install/share/vulkan/explicit_layer.d
          LD_LIBRARY_PATH: ${{ github.workspace }}/build/vulkan-install/lib
          VK_INSTANCE_LAYERS: VK_LAYER_SCSKILLER
          NODEVICE_SELECT: "1"
          SCSKILLER_VK_DEBUG: "1"
          VK_LOADER_DEBUG: "all"
          SCSKILLER_VK_REPLAY_CACHE: ${{ github.workspace }}/build/vulkan-smoke/warmed.cache.bin
          SCSKILLER_VK_RECORD: "1"
          SCSKILLER_VK_RECORD_FILE: ${{ github.workspace }}/build/vulkan-smoke/cache-replay-capture.jsonl
        run: |
          rm -f build/vulkan-smoke/cache-replay-capture.jsonl

          timeout 60s build/vulkan-probe/scskiller-vulkan-probe build/vulkan-smoke/compute.spv
          test -s build/vulkan-smoke/cache-replay-capture.jsonl
          grep -q '"event":"pipeline_cache_replay"' build/vulkan-smoke/cache-replay-capture.jsonl
      - name: Reject incompatible driver cache without breaking the app
        env:
          VK_LAYER_PATH: ${{ github.workspace }}/build/vulkan-install/share/vulkan/explicit_layer.d
          LD_LIBRARY_PATH: ${{ github.workspace }}/build/vulkan-install/lib
          VK_INSTANCE_LAYERS: VK_LAYER_SCSKILLER
          NODEVICE_SELECT: "1"
          SCSKILLER_VK_REPLAY_CACHE: ${{ github.workspace }}/build/vulkan-smoke/invalid-cache.bin
          SCSKILLER_VK_RECORD: "1"
          SCSKILLER_VK_RECORD_FILE: ${{ github.workspace }}/build/vulkan-smoke/cache-rejected-capture.jsonl
        run: |
          python3 - <<'PY'
          from pathlib import Path
          Path("build/vulkan-smoke/invalid-cache.bin").write_bytes(bytes(32))
          PY
          timeout 60s build/vulkan-probe/scskiller-vulkan-probe build/vulkan-smoke/compute.spv
          test -s build/vulkan-smoke/cache-rejected-capture.jsonl
          grep -q '"event":"pipeline_cache_replay_skipped"' build/vulkan-smoke/cache-rejected-capture.jsonl
      - name: Replay captured graphics pipeline with Vulkan warmer
        run: |
          timeout 60s build/vulkan-warmer/scskiller-vulkan-warmer \
            build/vulkan-smoke/graphics-capture.jsonl \
            - \
            build/vulkan-smoke/graphics-warmed.cache.bin \
            > build/vulkan-smoke/graphics-replay.log 2>&1
          cat build/vulkan-smoke/graphics-replay.log
          test -s build/vulkan-smoke/graphics-warmed.cache.bin
          grep -q 'Graphics replay: requested 1, compiled 1, skipped 0, failed 0' build/vulkan-smoke/graphics-replay.log
      - name: Exercise C# Vulkan warmer integration in CI
        run: |
          timeout 60s dotnet run --project src/SCSKiller.Linux.Cli/SCSKiller.Linux.Cli.csproj -c Release -- \
            warm-vulkan build/vulkan-smoke/capture.jsonl \
            --output-cache build/vulkan-smoke/managed-warmed.cache.bin \
            --warmer ${{ github.workspace }}/build/vulkan-warmer/scskiller-vulkan-warmer
          test -s build/vulkan-smoke/managed-warmed.cache.bin
      - name: Exercise native Vulkan recording through the managed CLI
        env:
          NODEVICE_SELECT: "1"
          SCSKILLER_VK_DEBUG: "1"
          VK_LOADER_DEBUG: "all"
        run: |
          echo "Managed recorder layer dir: ${{ github.workspace }}/build/vulkan-install/share/vulkan/explicit_layer.d"
          timeout 60s dotnet run --project src/SCSKiller.Linux.Cli/SCSKiller.Linux.Cli.csproj -c Release -- \
            record-vulkan build/vulkan-probe/scskiller-vulkan-probe \
            ${{ github.workspace }} \
            ${{ github.workspace }}/build/vulkan-install/share/vulkan/explicit_layer.d \
            build/vulkan-smoke/managed-native-capture.jsonl \
            build/vulkan-smoke/compute.spv
          test -s build/vulkan-smoke/managed-native-capture.jsonl
          cat build/vulkan-smoke/managed-native-capture.jsonl
          grep -q '"event":"compute_pipeline_state"' build/vulkan-smoke/managed-native-capture.jsonl
      - name: Stage and smoke-test Linux package
        env:
          STAGE: ${{ github.workspace }}/build/package-smoke
          BUILD_ROOT: ${{ github.workspace }}/build/package-native
        run: |
          bash scripts/package-linux.sh
          test -x build/package-smoke/bin/scskiller-linux
          test -s build/package-smoke/lib/VK_LAYER_SCSKILLER.so
          test -s build/package-smoke/share/vulkan/explicit_layer.d/layer.json
          test -x build/package-smoke/bin/scskiller-vulkan-warmer
          build/package-smoke/bin/scskiller-linux help
          timeout 60s build/package-smoke/bin/scskiller-linux warm-vulkan build/vulkan-smoke/capture.jsonl \
            --output-cache build/vulkan-smoke/package-warmed.cache.bin \
            --warmer build/package-smoke/bin/scskiller-vulkan-warmer
          test -s build/vulkan-smoke/package-warmed.cache.bin
